[package]
name = "Netdraw"
version = "0.1.0"
edition = "2024"

[dependencies]
arboard = { version = "3.6.1", features = ["wayland-data-control"] }
eframe = "0.36.1"
resvg = { version = "0.48.0", default-features = false, features = ["text"] }
rfd = "0.17.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[build-dependencies]
winresource = "0.1"
